<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUANIFY Admin Provisioning</title>
<style>
body{margin:0;background:#09090b;color:#f5f5f5;font-family:Arial,sans-serif}
main{max-width:900px;margin:40px auto;padding:24px}
.card{background:#111114;border:1px solid #2b2b31;border-radius:18px;padding:24px;margin-bottom:20px}
h1{margin:0 0 8px;font-size:32px}.muted{color:#9a9aa5}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin-right:8px}
#one{background:#f4c400;color:#111}#ten{background:#fff;color:#111}
pre{white-space:pre-wrap;word-break:break-word;background:#050506;border-radius:12px;padding:16px;overflow:auto}
.ok{color:#8ff0a4}.err{color:#ff8d8d}
</style>
</head>
<body>
<main>
<div class="card">
  <div class="muted">CUANIFY INTERNAL</div>
  <h1>Auth Provisioning</h1>
  <div id="who" class="muted">Memeriksa session...</div>
</div>
<div class="card" id="loginCard">
  <p><b>Login admin diperlukan.</b></p>
  <p class="muted">Login menggunakan akun CUANIFY yang sudah masuk allowlist provisioning.</p>
  <input id="email" type="email" autocomplete="username" placeholder="Email admin" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #333;background:#09090b;color:#fff;margin:6px 0;">
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #333;background:#09090b;color:#fff;margin:6px 0 12px;">
  <button id="login" type="button" style="background:#f4c400;color:#111">LOGIN ADMIN</button>
  <div id="loginStatus" class="muted" style="margin-top:10px"></div>
</div>
<div class="card" id="provisionCard" style="display:none">
  <p>Provisioning hanya mengambil queue <b>HIGH confidence</b>, verified, email valid, dan belum punya Auth.</p>
  <button id="one">PROVISION 1</button>
  <button id="ten">PROVISION 10</button>
  <button id="logout" style="background:#2b2b31;color:#fff">LOGOUT</button>
</div>
<div class="card">
  <div id="status" class="muted">Belum ada proses.</div>
  <pre id="result"></pre>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nwjmtnaqbiwhrmgimyqy.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_6x3fyciQNza50vtKq1S53w_xsogvAJc";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const who=document.getElementById("who");
const statusEl=document.getElementById("status");
const resultEl=document.getElementById("result");
const loginCard=document.getElementById("loginCard");
const provisionCard=document.getElementById("provisionCard");
const loginStatus=document.getElementById("loginStatus");
const emailEl=document.getElementById("email");
const passwordEl=document.getElementById("password");
const loginBtn=document.getElementById("login");

function showAdmin(session){
  if(!session){
    who.textContent="Belum login.";
    loginCard.style.display="block";
    provisionCard.style.display="none";
    return;
  }
  who.textContent="Login: "+(session.user.email||session.user.id);
  loginCard.style.display="none";
  provisionCard.style.display="block";
}

async function init(){
  try{
    who.textContent="Menghubungkan ke CUANIFY Auth...";
    const {data,error}=await supabaseClient.auth.getSession();
    if(error) throw error;
    showAdmin(data.session);
  }catch(error){
    who.textContent="Auth error: "+(error.message||String(error));
    loginStatus.textContent="Koneksi Auth gagal. Coba refresh halaman.";
  }
  supabaseClient.auth.onAuthStateChange((_event,session)=>showAdmin(session));
}

async function handleAdminLogin(){
  loginBtn.disabled=true;
  loginStatus.textContent="Memproses login...";
  try{
    const email=emailEl.value.trim();
    const password=passwordEl.value;
    if(!email||!password){
      throw new Error("Email dan password wajib diisi.");
    }
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    loginStatus.textContent="Login berhasil.";
    showAdmin(data.session);
  }catch(error){
    loginStatus.textContent="Login gagal: "+(error.message||String(error));
  }finally{
    loginBtn.disabled=false;
  }
}

loginBtn.addEventListener("click",handleAdminLogin);
passwordEl.addEventListener("keydown",(event)=>{
  if(event.key==="Enter") handleAdminLogin();
});

async function run(batch){
  statusEl.textContent="Menjalankan batch "+batch+"...";
  resultEl.textContent="";
  document.querySelectorAll("#one,#ten").forEach(b=>b.disabled=true);
  try{
    const {data,error}=await supabaseClient.functions.invoke("provision-legacy-members",{body:{batch_size:batch}});
    if(error) throw error;
    statusEl.innerHTML='<span class="ok">SELESAI</span>';
    resultEl.textContent=JSON.stringify(data,null,2);
  }catch(e){
    statusEl.innerHTML='<span class="err">GAGAL</span>';
    resultEl.textContent=JSON.stringify(e,null,2);
  }finally{
    document.querySelectorAll("#one,#ten").forEach(b=>b.disabled=false);
  }
}

document.getElementById("one").addEventListener("click",()=>run(1));
document.getElementById("ten").addEventListener("click",()=>run(10));
document.getElementById("logout").addEventListener("click",async()=>{
  await supabaseClient.auth.signOut();
  resultEl.textContent="";
  statusEl.textContent="Belum ada proses.";
  loginStatus.textContent="";
  showAdmin(null);
});
init();
</script>
</body>
</html>
