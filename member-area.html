<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>CUANIFY | Member Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Raleway:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--surface:#111113;--surface2:#17171a;--text:#f7f7f8;--muted:#9a9aa3;--line:#28282d;--purple:#8b5cf6;--purple2:#a78bfa;--soft:rgba(139,92,246,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;padding-bottom:70px}a{text-decoration:none;color:inherit}.app{max-width:680px;margin:auto}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:rgba(7,7,7,.88);border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-inner{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.logo{font:900 22px Raleway;letter-spacing:-.7px}.logo span{color:var(--purple2)}
.top-actions{display:flex;align-items:center;gap:9px}.member-label{color:#777;font-size:10px;font-weight:800}.logout{border:1px solid var(--line);background:var(--surface);color:#bbb;padding:9px 12px;border-radius:11px;font-size:11px;font-weight:900;cursor:pointer}
.hero{padding:22px 0 8px}.hero-card{position:relative;overflow:hidden;padding:27px;border-radius:28px;background:radial-gradient(circle at 90% 15%,rgba(167,139,250,.33),transparent 27%),radial-gradient(circle at 10% 110%,rgba(139,92,246,.2),transparent 32%),linear-gradient(135deg,#16121f,#0f0f11 65%);border:1px solid #33264a}.hero-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:1px solid rgba(167,139,250,.18);right:-65px;top:-70px}
.eyebrow{display:inline-flex;color:#ddd0ff;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font:900 clamp(34px,5vw,55px)/.98 Raleway;letter-spacing:-2px;margin:13px 0 8px}.hero p{margin:0;color:#aaa1b5;font-size:12px;line-height:1.6}.email{margin-top:12px;color:#777;font-size:10px;position:relative;z-index:1}
.section{padding:20px 0}.section-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-title h2{font:900 21px Raleway;letter-spacing:-.8px;margin:0}.section-title span{color:var(--muted);font-size:11px}
.controls{display:flex;gap:10px;margin-bottom:16px}.search-wrap{position:relative;flex:1}.search{width:100%;height:48px;padding:0 16px 0 42px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:white;outline:none}.search:focus{border-color:#59417c;box-shadow:0 0 0 4px rgba(139,92,246,.1)}.search::placeholder{color:#6f6f77}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#777}
.product-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.product{position:relative;display:block;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.18s}.product:hover{background:var(--surface2);border-color:#4d3968;transform:translateY(-2px)}
.product-cover{height:155px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 82% 20%,rgba(167,139,250,.25),transparent 27%),linear-gradient(145deg,#21192f,#111114 72%)}.product-placeholder{width:65px;height:65px;border-radius:19px;display:grid;place-items:center;background:var(--soft);border:1px solid #584275;color:#d7c9ff;font:900 17px Raleway}.product-tag{position:absolute;left:11px;top:11px;padding:6px 8px;border-radius:999px;background:rgba(8,8,9,.82);border:1px solid rgba(255,255,255,.1);color:#ddd5ea;font-size:8px;font-weight:900}.lock{position:absolute;right:11px;top:11px;width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:rgba(8,8,9,.82);border:1px solid rgba(255,255,255,.1);font-size:12px}
.product-main{padding:14px}.product-main h3{margin:0;font:900 15px/1.25 Raleway;letter-spacing:-.35px}.product-main p{margin:6px 0 10px;color:var(--muted);font-size:10.5px;line-height:1.5;min-height:31px}.product-action{font-size:10px;font-weight:900;color:#cdbdff}.locked .product-action{color:#666}.locked{opacity:.72}
.empty{grid-column:1/-1;padding:40px 15px;text-align:center;color:#777;font-size:12px;border:1px dashed var(--line);border-radius:18px}.footer{padding:30px 20px 10px;color:#555;text-align:center;font-size:10px}
@media(max-width:720px){.product-list{grid-template-columns:1fr}.app{max-width:100%}}@media(max-width:520px){.topbar-inner{padding:0 16px}.member-label{display:none}.hero,.section{padding-left:16px;padding-right:16px}.hero-card{padding:23px;border-radius:23px}.hero h1{font-size:38px}.product-cover{height:145px}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">CUANIFY<span>.</span></div>
    <div class="top-actions"><span id="memberLabel" class="member-label"></span><button id="logout" class="logout">KELUAR</button></div>
  </div>
</header>

<section class="hero">
  <div class="hero-card">
    <div class="eyebrow">MEMBER AREA</div>
    <h1 id="greeting">Halo.</h1>
    <p>Semua produk CUANIFY ada di satu tempat. Produk yang kamu miliki bisa langsung dibuka dari sini.</p>
    <div id="email" class="email"></div>
  </div>
</section>

<section class="section">
  <div class="section-title"><h2>Produk CUANIFY</h2><span id="count">0 akses</span></div>
  <div class="controls"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="Cari produk..." autocomplete="off"></div></div>
  <main id="grid" class="product-list" aria-live="polite"><div class="empty">Memuat produk...</div></main>
</section>

<footer class="footer">© 2026 CUANIFY. Member Area.</footer>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
  "https://nwjmtnaqbiwhrmgimyqy.supabase.co",
  "sb_publishable_6x3fyciQNza50vtKq1S53w_xsogvAJc"
);

let products=[];

function productMark(name){
  const words=String(name||"").replace(/[^A-Za-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return "P";
  if(words.length===1) return words[0].slice(0,5).toUpperCase();
  return words.slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function productCategory(name,active){
  const n=String(name||"").toLowerCase();
  if(!active) return "Legacy";
  if(n.includes("member")||n.includes("jalur langit")||n.includes("pebisnis")) return "Member";
  if(n.includes("kelas")||n.includes("course")||n.includes("modul")||n.includes("kulwa")) return "Kelas";
  if(n.includes("prompt")||n.includes("kode")) return "Prompt";
  if(n.includes("affiliate")||n.includes("affiliasi")) return "Affiliate";
  return "Produk";
}

const app=document.getElementById("app");
const grid=document.getElementById("grid");
const search=document.getElementById("search");
const count=document.getElementById("count");
let owned=new Set();

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function render(){
  const q=search.value.trim().toLowerCase();
  const filtered=products.filter(p=>!q||Object.values(p).join(" ").toLowerCase().includes(q));

  if(!filtered.length){
    grid.innerHTML='<div class="empty">Produk tidak ditemukan.</div>';
    return;
  }

  grid.innerHTML=filtered.map(p=>{
    const hasAccess=owned.has(p.slug);
    const cardClass=hasAccess?"product":"product locked";
    const inner=
      '<div class="product-cover">'+
        '<div class="product-placeholder">'+escapeHtml(p.mark)+'</div>'+
        '<span class="product-tag">'+escapeHtml(p.cat)+'</span>'+
        (!hasAccess?'<span class="lock" title="Belum memiliki akses">🔒</span>':'')+
      '</div>'+
      '<div class="product-main">'+
        '<h3>'+escapeHtml(p.name)+'</h3>'+
        '<p>'+escapeHtml(p.desc)+'</p>'+
        '<div class="product-action">'+(hasAccess?"BUKA PRODUK →":"BELUM ADA AKSES")+'</div>'+
      '</div>';

    if(hasAccess && p.url){
      return '<a class="'+cardClass+'" href="'+p.url+'">'+inner+'</a>';
    }

    if(hasAccess && !p.url){
      const readyInner=inner.replace("BUKA PRODUK →","KONTEN SEGERA HADIR");
      return '<div class="'+cardClass+'" title="Konten produk sedang disiapkan">'+readyInner+'</div>';
    }

    return '<div class="'+cardClass+'" title="Produk ini belum terhubung ke akun kamu">'+inner+'</div>';
  }).join("");
}

async function boot(){
  const {data:{session}}=await supabase.auth.getSession();

  if(!session){
    location.replace("login.html");
    return;
  }

  const {data:firstLogin,error:firstLoginError}=await supabase.rpc("get_my_first_login_state");

  if(firstLoginError){
    location.replace("login.html");
    return;
  }

  if(firstLogin?.required){
    location.replace("change-password.html");
    return;
  }

  app.hidden=false;

  const email=session.user.email||"";
  document.getElementById("email").textContent=email;
  document.getElementById("memberLabel").textContent=email;

  const name=email.split("@")[0]||"Member";
  document.getElementById("greeting").textContent="Halo, "+name+".";

  const {data,error}=await supabase.rpc("get_my_product_access");

  if(!error && Array.isArray(data)){
    owned=new Set(
      data.map(p=>p.slug).filter(Boolean)
    );
  }

  count.textContent=owned.size+" akses";
  render();
}

search.addEventListener("input",render);

document.getElementById("logout").addEventListener("click",async()=>{
  await supabase.auth.signOut();
  location.replace("login.html");
});

boot();
</script>
</body>
</html>
