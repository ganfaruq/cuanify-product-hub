<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Area | CUANIFY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--surface:#111113;--surface2:#17171a;--line:#29292f;--text:#f7f7f8;--muted:#9999a2;--purple:#8b5cf6;--purple2:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:50px}.top{height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;background:rgba(7,7,7,.9);backdrop-filter:blur(16px);z-index:5}.logo{font:900 22px Raleway}.logo span{color:var(--purple2)}.logout{border:1px solid var(--line);background:var(--surface);color:#bbb;padding:9px 12px;border-radius:11px;font-size:11px;font-weight:900;cursor:pointer}.hero{padding:25px 20px 16px}.eyebrow{font-size:10px;letter-spacing:.12em;color:#cdbdff;font-weight:900}.hero h1{font:900 35px Raleway;letter-spacing:-1.4px;margin:9px 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px}.stat{padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.stat b{display:block;font:900 25px Raleway}.stat span{font-size:10px;color:var(--muted)}section{padding:0 20px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:5px 0 13px}.section-head h2{font:900 20px Raleway;margin:0}.section-head span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{display:flex;flex-direction:column;min-height:180px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#4d3968;background:var(--surface2)}.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(139,92,246,.13);border:1px solid #4a3565;color:#d6c7ff;font:900 12px Raleway}.card h3{font:900 15px Raleway;line-height:1.25;margin:13px 0 5px}.card p{font-size:11px;color:var(--muted);line-height:1.45;margin:0}.open{margin-top:auto;padding-top:15px;color:#cdbdff;font-size:11px;font-weight:900}.state{margin:20px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:12px;line-height:1.6}.footer{text-align:center;color:#555;font-size:10px;padding:30px 20px}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:31px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">CUANIFY<span>.</span></div><button id="logout" class="logout">KELUAR</button></header>
<main>
<div class="hero"><div class="eyebrow">MEMBER AREA</div><h1 id="greeting">Halo.</h1><p>Semua produk yang sudah kamu miliki ada di sini.</p></div>
<div class="stats"><div class="stat"><b id="count">0</b><span>PRODUK AKTIF</span></div><div class="stat"><b>CUANIFY</b><span>MEMBER ACCESS</span></div></div>
<section><div class="section-head"><h2>Produk Saya</h2><span id="email"></span></div><div id="grid" class="grid"><div class="state">Memuat akses produk...</div></div></section>
</main>
<div class="footer">© 2026 CUANIFY. Member Area.</div>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://nwjmtnaqbiwhrmgimyqy.supabase.co","sb_publishable_6x3fyciQNza50vtKq1S53w_xsogvAJc");
const grid=document.getElementById("grid"),count=document.getElementById("count"),emailEl=document.getElementById("email"),greeting=document.getElementById("greeting");
const {data:{session}}=await supabase.auth.getSession();
if(!session){location.href="login.html"}else{
 emailEl.textContent=session.user.email||"";
 const name=(session.user.user_metadata?.name||session.user.email?.split("@")[0]||"Member");
 greeting.textContent="Halo, "+name+".";
 const {data,error}=await supabase.rpc("get_my_product_access");
 if(error){grid.innerHTML='<div class="state">Akses member belum terhubung. Hubungi admin untuk aktivasi akun.</div>'}
 else if(!data?.length){grid.innerHTML='<div class="state">Belum ada produk aktif di akun ini.</div>'}
 else{
  count.textContent=data.length;
  grid.innerHTML=data.map(p=>{
   const mark=(p.product_name||"CUANIFY").replace(/[^A-Z0-9]/gi,"").slice(0,5).toUpperCase();
   return '<a class="card" href="'+(p.access_url||"#")+'" target="_blank" rel="noopener"><div class="icon">'+mark+'</div><h3>'+p.product_name+'</h3><p>'+((p.product_description||"Akses produk CUANIFY.")+'</p><div class="open">BUKA PRODUK →</div></a>'
  }).join("");
 }
}
document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();location.href="login.html"};
</script>
</body>
</html>
