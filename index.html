<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUANIFY | Product Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 24px}nav{height:78px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242428}.logo{font-size:22px;font-weight:900}.logo b{color:#f4c400}.pill,.filter{border:1px solid #303036;background:#121216;color:#bbb;padding:9px 13px;border-radius:999px;font-size:13px}.hero{padding:70px 0 30px}.eyebrow{color:#f4c400;font-size:12px;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.93;letter-spacing:-.06em;max-width:850px;margin:15px 0}.hero p{color:#aaa;max-width:680px;font-size:18px;line-height:1.6}.search{width:100%;max-width:700px;padding:16px 18px;border-radius:14px;border:1px solid #303036;background:#151519;color:#fff}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.filter{cursor:pointer}.active{background:#f4c400;color:#111;border-color:#f4c400;font-weight:900}.head{display:flex;justify-content:space-between;margin:30px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.card{background:#121216;border:1px solid #29292f;border-radius:20px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px)}.cover{height:200px;background:linear-gradient(135deg,#25252c,#101014);display:grid;place-items:center;position:relative}.tag{position:absolute;top:14px;left:14px;background:#f4c400;color:#111;padding:6px 9px;border-radius:8px;font-size:10px;font-weight:900}.mark{font-size:44px;font-weight:950}.body{padding:19px}.body h3{margin:0 0 8px;font-size:20px}.body p{color:#92929a;font-size:13px;line-height:1.55;min-height:42px}.go{color:#f4c400;font-weight:900;font-size:12px}.meta{display:flex;justify-content:space-between}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav><div class="logo">CUANIFY<b>.</b></div><span class="pill">Product Hub</span></nav><section class="hero"><div class="eyebrow">CUANIFY PRODUCT HUB</div><h1>Semua tools untuk bikin bisnis digital.</h1><p>Satu tempat untuk menemukan produk, tools, prompt, dan aset digital CUANIFY. Pilih produk, lalu langsung akses.</p><input id="search" class="search" placeholder="Cari produk, misalnya: prompt, ebook, AI..."><div class="filters"><button class="filter active" data-c="all">Semua</button><button class="filter" data-c="VIP Member">VIP Member</button><button class="filter" data-c="AI Tools">AI Tools</button><button class="filter" data-c="Prompt">Prompt</button><button class="filter" data-c="Ebook">Ebook</button><button class="filter" data-c="Template">Template</button></div></section><div class="head"><b>Produk CUANIFY</b><small id="count"></small></div><main id="grid" class="grid"></main><footer>© 2026 CUANIFY. Digital products for digital business.</footer></div><script>
const ps=[["VIP MEMBER","VIP Member","VIP","Akses semua produk CUANIFY untuk paid member, termasuk update produk.","vip-member.html"],["CUANIFY TOOLS","AI Tools","TOOLS","Akses CUANIFY Tools lengkap dengan 12 video tutorial fitur.","cuanify-tools.html"],["365 Prompt Viral","Prompt","365","Kumpulan prompt siap pakai untuk membuat konten dan mengembangkan bisnis digital.","#"],["AI Karyawan","AI Tools","AI","Tools AI untuk membantu pekerjaan rutin pebisnis digital.","#"],["BikinEbook","AI Tools","EBOOK","Buat ebook digital lengkap dengan struktur dan cover siap jual.","#"],["Blueprint Produk Digital","Ebook","BP","Panduan menemukan ide, membuat produk, sampai menjualnya.","#"],["Content Machine","Template","CM","Template sistem konten untuk produksi konten bisnis lebih konsisten.","#"],["CustomGPT Kit","AI Tools","GPT","Template untuk membangun asisten AI sesuai kebutuhan.","#"]];
let cat="all";const g=document.querySelector("#grid"),s=document.querySelector("#search"),n=document.querySelector("#count");function render(){let q=s.value.toLowerCase(),a=ps.filter(p=>(cat==="all"||p[1]===cat)&&(!q||p.join(" ").toLowerCase().includes(q)));n.textContent=a.length+" produk";g.innerHTML=a.map(p=>'<article class="card"><div class="cover"><span class="tag">'+p[1]+'</span><div class="mark">'+p[2]+'</div></div><div class="body"><h3>'+p[0]+'</h3><p>'+p[3]+'</p><div class="meta"><small>'+p[1]+'</small><a class="go" href="'+p[4]+'">AKSES PRODUK →</a></div></div></article>').join("")}document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.c;render()});s.oninput=render;render();</script></body></html>
