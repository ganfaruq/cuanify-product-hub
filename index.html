<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>CUANIFY | Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;
  --surface:#111113;
  --surface2:#0c0c0e;
  --line:#29292f;
  --text:#f7f7f8;
  --muted:#92929b;
  --purple:#8b5cf6;
  --purple2:#a78bfa;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -5%,rgba(139,92,246,.22),transparent 34%),
    radial-gradient(circle at 15% 90%,rgba(139,92,246,.07),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Nunito,system-ui,sans-serif;
  display:grid;
  place-items:center;
  padding:24px;
}
.shell{width:min(440px,100%)}
.brand{
  text-align:center;
  font:900 25px/1 Raleway,system-ui,sans-serif;
  letter-spacing:-1px;
  margin-bottom:26px;
}
.brand span{color:var(--purple2)}
.card{
  background:rgba(17,17,19,.96);
  border:1px solid var(--line);
  border-radius:26px;
  padding:30px;
  box-shadow:0 24px 80px rgba(0,0,0,.42);
}
.eyebrow{
  color:var(--purple2);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.6px;
  margin-bottom:9px;
}
h1{
  font:900 31px/1.05 Raleway,system-ui,sans-serif;
  letter-spacing:-1.2px;
  margin:0 0 9px;
}
.intro{
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  margin:0 0 24px;
}
label{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:.7px;
  margin:15px 0 7px;
}
input{
  width:100%;
  height:49px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface2);
  color:#fff;
  padding:0 14px;
  outline:none;
  font:600 14px Nunito,system-ui,sans-serif;
  transition:border-color .15s,box-shadow .15s;
}
input::placeholder{color:#5f5f68}
input:focus{
  border-color:#62438e;
  box-shadow:0 0 0 4px rgba(139,92,246,.1);
}
button{
  width:100%;
  height:51px;
  border:0;
  border-radius:14px;
  background:var(--purple);
  color:#fff;
  font:900 13px Nunito,system-ui,sans-serif;
  letter-spacing:.5px;
  margin-top:21px;
  cursor:pointer;
  transition:transform .15s,filter .15s;
}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:wait;transform:none}
.msg{
  display:none;
  margin-top:14px;
  padding:11px 13px;
  border-radius:12px;
  background:#1c1524;
  border:1px solid #493361;
  color:#d9c8ef;
  font-size:12px;
  line-height:1.55;
}
.footer{
  text-align:center;
  color:#5f5f66;
  font-size:11px;
  margin-top:20px;
}
.footer strong{color:#77777f}
@media(max-width:480px){
  body{padding:18px}
  .card{padding:25px 21px;border-radius:22px}
  h1{font-size:28px}
}
</style>
</head>
<body>
<main class="shell">
  <div class="brand">CUANIFY<span>.</span></div>

  <section class="card" aria-label="Login CUANIFY">
    <div class="eyebrow">MEMBER ACCESS</div>
    <h1>Selamat datang.</h1>
    <p class="intro">
      Masuk untuk melihat semua produk CUANIFY yang sudah menjadi milik kamu.
    </p>

    <form id="form">
      <label for="email">EMAIL</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        required
        placeholder="nama@email.com"
      >

      <label for="password">PASSWORD</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Password"
      >

      <button id="submit" type="submit">MASUK KE MEMBER AREA</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
  </section>

  <div class="footer">
    <strong>CUANIFY.</strong> Member Area
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://nwjmtnaqbiwhrmgimyqy.supabase.co",
  "sb_publishable_6x3fyciQNza50vtKq1S53w_xsogvAJc"
);

const form = document.getElementById("form");
const email = document.getElementById("email");
const password = document.getElementById("password");
const btn = document.getElementById("submit");
const msg = document.getElementById("msg");

const show = (text) => {
  msg.textContent = text;
  msg.style.display = "block";
};

const { data: { session } } = await supabase.auth.getSession();

if (session) {
  location.replace("member-area.html");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  msg.style.display = "none";
  btn.disabled = true;
  btn.textContent = "MEMPROSES...";

  const { error } = await supabase.auth.signInWithPassword({
    email: email.value.trim(),
    password: password.value
  });

  if (error) {
    show("Email atau password salah. Jika kamu sudah memiliki akses produk tetapi belum memiliki akun login, hubungi admin.");
    btn.disabled = false;
    btn.textContent = "MASUK KE MEMBER AREA";
    return;
  }

  location.replace("member-area.html");
});
</script>
</body>
</html>
